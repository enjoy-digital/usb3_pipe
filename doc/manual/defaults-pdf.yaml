# pandoc defaults for the PDF build of the USB3-PIPE manual (rewritten by build.py into build/doc/src
# with absolute paths: run build.py, not pandoc directly).
from: markdown+pipe_tables+grid_tables+fenced_code_attributes+implicit_figures+link_attributes+raw_tex
to: latex
template: @MANUAL@/template/eisvogel.latex
pdf-engine: xelatex
toc: true
toc-depth: 3
number-sections: true
listings: true
top-level-division: chapter
metadata-file: metadata.yaml
filters:
  - @MANUAL@/tools/breakcode.lua
  - @MANUAL@/tools/svg2pdf.lua
resource-path: []
input-files:
  - 00_front.md
  - 01_introduction.md
  - 02_usb3_primer.md
  - 03_phy_architecture.md
  - 04_link_training.md
  - 05_datapath.md
  - 06_transceivers.md
  - 07_core_architecture.md
  - 08_classes.md
  - 09_boards.md
  - 10_getting_started.md
  - 11_integration.md
  - 12_examples.md
  - 13_simulation.md
  - 14_debugging.md
  - Z_appendix.md
  - A_registers.md
  - B_build_options.md
  - C_glossary.md
  - D_performance.md
  - E_maintenance.md
output-file: ../../build/doc/usb3_pipe_manual.pdf
