# USB3-PIPE standalone core: Kintex7 (GTX) USB 3.2 Gen 1x1 (5Gbps) device.
# Similar to the KC705 target (bench/kc705.py), with a dedicated 125MHz transceiver refclk.
{
    "phy"            : "K7USB3SerDes",
    "device"         : "xc7k325t-ffg900-2",
    "speedgrade"     : -2,
    "sys_clk_freq"   : 125e6,
    "refclk"         : "pads",
    "refclk_freq"    : 125e6,
    "role"           : "device",
    "with_link_ctrl" : True,
}
