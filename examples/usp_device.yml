# USB3-PIPE standalone core: Kintex UltraScale+ (GTY) USB 3.2 Gen 1x1 (5Gbps) device.
# Similar to the Alibaba Cloud XCKU3P target (bench/alibaba_xcku3p.py), with a dedicated transceiver
# refclk.
{
    "phy"          : "USPUSB3SerDes",
    "device"       : "xcku3p-ffvb676-2-e",
    "speedgrade"   : -2,
    "sys_clk_freq" : 125e6,
    "refclk"       : "pads",
    "refclk_freq"  : 156.25e6,
    "role"         : "device",
    "usb_core"     : True,
}
