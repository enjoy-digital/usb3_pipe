[pytest]
testpaths = test
markers =
    slow: long simulations, not run by default (run with: pytest -m slow)
    sim: Verilator simulations (sim.py builds, run with: pytest -m sim)
    hw: tests on real hardware (AgentLab device), not run by default (run with: pytest -m hw)
addopts = -m "not slow and not hw"
